version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scalecheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scalecheck_user
      POSTGRES_PASSWORD: scalecheck_secure_password
      POSTGRES_DB: scalecheck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalecheck_user -d scalecheck_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scalecheck-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://scalecheck_user:scalecheck_secure_password@postgres:5432/scalecheck_db?schema=public
      JWT_SECRET: super_secret_jwt_key_legal_metrology_2026
      JWT_REFRESH_SECRET: super_secret_refresh_key_doca_scalecheck_2026
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scalecheck-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
