name: scalecheck_mobile
description: "ScaleCheck - National Legal Metrology Verification System (Field Officer & Trader App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.4.1
  http: ^1.2.0

  # Local SQLite Database (Offline Sync)
  sqflite: ^2.3.2
  path: ^1.9.0

  # State Management & Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

  # Hardware Access & Sensor APIs
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  mobile_scanner: ^5.1.0

  # UI & Design System
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
